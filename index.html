<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Până la 200% bonus + 300 rotiri gratis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,800;0,900;1,800;1,900&family=Rubik:wght@400&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>

  <!-- Top controls: language switch + mute -->
  <div class="controls">
    <div class="lang-switch" role="group" data-i18n-aria="langGroup" aria-label="Limba">
      <button type="button" class="lang-btn" data-lang="ro" aria-pressed="true">RO</button>
      <button type="button" class="lang-btn" data-lang="ru" aria-pressed="false">RU</button>
    </div>
    <button type="button" class="mute-btn" id="muteBtn" aria-pressed="false" data-i18n-aria="mute" aria-label="Sunet">
      <svg class="ico-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.47 4.47 0 0 0 2.5-4zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm18.7 1.7-1.4-1.4L18 11.6l-2.3-2.3-1.4 1.4 2.3 2.3-2.3 2.3 1.4 1.4 2.3-2.3 2.3 2.3 1.4-1.4-2.3-2.3 2.3-2.3z"/></svg>
    </button>
  </div>

  <main class="stage" id="stage">
    <!-- Offer headline -->
    <header class="offer">
      <p class="offer__prefix" data-i18n="offerPrefix">PÂNĂ LA</p>
      <h1 class="offer__main">
        <span class="offer__big">200%</span>
        <span class="offer__word" data-i18n="offerWord">BONUS</span>
      </h1>
      <p class="offer__plate"><span data-i18n="offerPlate">+ 300 ROTIRI GRATIS</span></p>
    </header>

    <!-- Wheel (geometry in Figma desktop px, scaled via --s) -->
    <section class="wheel-wrap" aria-label="Wheel">
      <div class="wheel-scaler">
        <div class="wheel" id="wheel">
          <img class="abs" src="assets/glow.svg" alt="" style="left:-57px;top:-57px;width:680px;height:680px">
          <img class="abs" src="assets/shadow.svg" alt="" style="left:-15px;top:2px;width:595px;height:595px">
          <img class="abs" src="assets/rim.svg" alt="" style="left:14px;top:14px;width:538px;height:538px">
          <img class="abs" src="assets/bulb-track.svg" alt="" style="left:25px;top:25px;width:515px;height:515px">
          <img class="abs" src="assets/inner-bevel.svg" alt="" style="left:50px;top:50px;width:467px;height:467px">

          <!-- Rotating disc -->
          <div class="rotor" id="rotor">
            <img class="abs" src="assets/seg-slot.svg" alt="" style="left:123.33px;top:57px;width:320.32px;height:226.5px">
            <img class="abs" src="assets/seg-1xbet-120.svg" alt="" style="left:283.5px;top:123.33px;width:226.5px;height:320.32px">
            <img class="abs" src="assets/seg-7777.svg" alt="" style="left:123.33px;top:283.5px;width:320.32px;height:226.5px">
            <img class="abs" src="assets/seg-1xbet-150.svg" alt="" style="left:57px;top:123.33px;width:226.5px;height:320.32px">
            <span class="divider" style="transform:rotate(-45deg)"></span>
            <span class="divider" style="transform:rotate(45deg)"></span>
            <span class="divider" style="transform:rotate(135deg)"></span>
            <span class="divider" style="transform:rotate(-135deg)"></span>
            <img class="abs" src="assets/vignette.svg" alt="" style="left:57px;top:57px;width:453px;height:453px">
            <img class="abs" src="assets/segframe-left.svg" alt="" style="left:75px;top:145.18px;width:54.83px;height:276.65px">
            <img class="abs" src="assets/segframe-bottom.svg" alt="" style="left:145.18px;top:437.17px;width:276.65px;height:54.83px">
            <img class="abs" src="assets/segframe-right.svg" alt="" style="left:437.17px;top:145.18px;width:54.83px;height:276.65px">
            <img class="abs" src="assets/segframe-top.svg" alt="" style="left:145.18px;top:75px;width:276.65px;height:54.83px">

            <div class="lbl lbl--slot">
              <span class="lbl__logo"><img src="assets/logo-slot.svg" alt="SLOT"></span>
              <span class="lbl__pct">200%</span>
              <span class="lbl__fs">+ 300 FS</span>
            </div>
            <div class="lbl lbl--side lbl--right">
              <span class="lbl__brand"><b>1x</b>Bet</span>
              <span class="lbl__pct">120%</span>
              <span class="lbl__fs">+ 150 FS</span>
            </div>
            <div class="lbl lbl--7777">
              <span class="lbl__logo7777"><img src="assets/logo-7777.svg" alt="Loteria Naţională 7777.md" width="110" height="62"></span>
              <span class="lbl__pct">175%</span>
              <span class="lbl__fs">+ 200 FS</span>
            </div>
            <div class="lbl lbl--side lbl--left">
              <span class="lbl__brand"><b>1x</b>Bet</span>
              <span class="lbl__pct">150%</span>
              <span class="lbl__fs">+ 200 FS</span>
            </div>
          </div>

          <img class="abs win-fx" id="winFx" src="assets/win-fx.svg" alt="" style="left:0;top:0;width:566px;height:566px">
          <div class="bulbs" id="bulbs" aria-hidden="true"></div>
          <img class="abs" src="assets/hub-ring.svg" alt="" style="left:204px;top:210px;width:159px;height:159px">
          <img class="abs" src="assets/hub-core.svg" alt="" style="left:230px;top:230px;width:106px;height:106px">
          <img class="abs" src="assets/hub-dot.svg" alt="" style="left:248px;top:248px;width:71px;height:71px">
          <img class="abs pointer" src="assets/pointer.svg" alt="" style="left:225.5px;top:-51.5px;width:115px;height:147.5px">

          <!-- SPIN button -->
          <button type="button" class="spin" id="spinBtn">
            <span class="spin__rim" aria-hidden="true"></span>
            <span class="spin__track" aria-hidden="true"></span>
            <span class="spin__bulbs" id="spinBulbs" aria-hidden="true"></span>
            <span class="spin__core" aria-hidden="true"></span>
            <span class="spin__gloss" aria-hidden="true"></span>
            <span class="spin__label">
              <img src="assets/spin-icon.svg" alt="" width="49" height="49">
              <span data-i18n="spin">SPIN</span>
            </span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- Sticky CTA (after popup closed) -->
  <div class="sticky-cta" id="stickyCta" hidden>
    <button type="button" class="btn-blue" id="stickyBtn" data-i18n="cta">Vreau Rotirile</button>
  </div>

  <!-- Win popup -->
  <div class="overlay" id="overlay" hidden>
    <div class="popup" id="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle" tabindex="-1">
      <button type="button" class="popup__close" id="closeBtn" data-i18n-aria="close" aria-label="Închide">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="10.33" y="2" width="3.33" height="20" rx="2" fill="#fff" transform="rotate(45 12 12)"/><rect x="10.33" y="2" width="3.33" height="20" rx="2" fill="#fff" transform="rotate(135 12 12)"/></svg>
      </button>
      <h2 class="popup__title" id="popupTitle" data-i18n="popTitle">Felicitări! Ai câștigat</h2>
      <div class="popup__prize">
        <span class="popup__line" aria-hidden="true"></span>
        <div class="popup__offer">
          <p class="popup__prefix" data-i18n="popPrefix">Până la</p>
          <p class="popup__big" id="popBig">200%</p>
          <p class="popup__sub" id="popSub">bonus + 300 Rotiri Gratis</p>
        </div>
        <span class="popup__line" aria-hidden="true"></span>
      </div>
      <div class="timer" role="timer" aria-live="off">
        <span class="timer__label" data-i18n="expires">Oferta expiră în:</span>
        <span class="timer__boxes">
          <i class="timer__sep" aria-hidden="true"></i>
          <span class="timer__unit"><b id="tMin">03</b><span data-i18n="min">min</span></span>
          <i class="timer__sep" aria-hidden="true"></i>
          <span class="timer__unit"><b id="tSec">00</b><span data-i18n="sec">sec</span></span>
          <i class="timer__sep" aria-hidden="true"></i>
        </span>
      </div>
      <div class="popup__cta">
        <button type="button" class="btn-blue popup__btn" id="submitBtn"><span class="cta-full" data-i18n="cta">Vreau Rotirile</span><span class="cta-short" data-i18n="ctaShort">Vreau Rotirile</span></button>
      </div>
    </div>
  </div>

  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <script src="js/main.js"></script>
</body>
</html>
